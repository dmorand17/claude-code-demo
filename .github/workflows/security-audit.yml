name: Security Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  security-audit:
    name: Claude Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run security audit
        id: audit
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          git diff --name-only "origin/$BASE_REF...HEAD" > changed-files.txt
          echo "Changed files:"
          cat changed-files.txt

          # File list is written to changed-files.txt and referenced by path — never
          # interpolated into the prompt string — to prevent prompt injection via filenames.
          PROMPT="Perform a security audit of the changed files listed in changed-files.txt.

            Read changed-files.txt to get the list of files, then read each file's full
            content and audit for:
            - Injection vulnerabilities (SQL, command, LDAP)
            - Sensitive data exposure or hardcoded secrets
            - Broken authentication or authorization
            - Security misconfiguration
            - XSS vulnerabilities
            - Insecure dependencies
            - Path traversal or SSRF
            - Missing input validation

            Format your findings as:
            ## Security Audit Report

            For each finding use:
            - **Severity**: Critical / High / Medium / Low / Informational
            - **Location**: file:line
            - **Description**: what the vulnerability is
            - **Remediation**: specific fix

            End with a ## Summary section listing the top issues to address.
            If no issues are found, say so clearly."

          printf '%s' "$PROMPT" | claude --agent security-auditor \
            --print \
            --output-format text \
            - \
            > audit-report.txt 2>&1

      - name: Fail if findings exist
        run: |
          if grep -qE '\*\*Severity\*\*:\s*(Critical|High)' audit-report.txt; then
            echo "Security findings detected — see PR comment for details."
            exit 1
          fi

      - name: Prepare audit comment
        if: always()
        run: |
          {
            printf '## 🔒 Claude Security Audit\n\n'
            printf '> Automated security review powered by the `security-auditor` sub-agent.\n\n'
            cat audit-report.txt
          } > audit-comment.txt

      - name: Post audit results as PR comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: claude-security-audit
          path: audit-comment.txt
