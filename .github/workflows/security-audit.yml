name: Security Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  security-audit:
    name: Claude Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run security audit
        id: audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF...HEAD" | tr '\n' ' ')
          echo "Changed files: $CHANGED_FILES"

          claude --agent security-auditor \
            --print \
            --output-format text \
            "Perform a security audit of the following changed files in this pull request: $CHANGED_FILES

            For each file, read its full content and audit for:
            - Injection vulnerabilities (SQL, command, LDAP)
            - Sensitive data exposure or hardcoded secrets
            - Broken authentication or authorization
            - Security misconfiguration
            - XSS vulnerabilities
            - Insecure dependencies
            - Path traversal or SSRF
            - Missing input validation

            Format your findings as:
            ## Security Audit Report

            For each finding use:
            - **Severity**: Critical / High / Medium / Low / Informational
            - **Location**: file:line
            - **Description**: what the vulnerability is
            - **Remediation**: specific fix

            End with a ## Summary section listing the top issues to address.
            If no issues are found, say so clearly." \
            > audit-report.txt 2>&1

      - name: Post audit results as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('audit-report.txt', 'utf8');

            const body = [
              '## 🔒 Claude Security Audit',
              '',
              '> Automated security review powered by the `security-auditor` sub-agent.',
              '',
              report,
              '',
              '---',
              '_To re-run, push a new commit or close and reopen the PR._',
            ].join('\n');

            // Delete previous audit comments to avoid clutter
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const comment of comments) {
              if (comment.user.login === 'github-actions[bot]' &&
                  comment.body.startsWith('## 🔒 Claude Security Audit')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
